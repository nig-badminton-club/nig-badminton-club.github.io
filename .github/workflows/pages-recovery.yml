name: Recover GitHub Pages deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    # Catch missed push events without checking every half hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: pages-recovery
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEPLOY_WORKFLOW: ci.yml
      DEFAULT_BRANCH: main
      MAX_RECOVERY_RUNS: "3"
    steps:
      # Never check out the triggering workflow's ref. This privileged workflow
      # uses only the trusted default branch, and runs no package install/build.
      - name: Checkout default-branch recovery script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/recover_pages.sh
          sparse-checkout-cone-mode: false
      - name: Recover a failed Pages deployment
        shell: bash
        run: bash scripts/recover_pages.sh
